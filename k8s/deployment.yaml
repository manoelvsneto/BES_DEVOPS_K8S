apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-veiculos
  namespace: crud-veiculos
  labels:
    app: crud-veiculos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: crud-veiculos
  template:
    metadata:
      labels:
        app: crud-veiculos
    spec:
      containers:
      - name: crud-veiculos
        image: crud-veiculos-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: crud-veiculos-config
              key: PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: crud-veiculos-config
              key: NODE_ENV
        - name: DATABASE_PATH
          valueFrom:
            configMapKeyRef:
              name: crud-veiculos-config
              key: DATABASE_PATH
        - name: BASE_PATH
          valueFrom:
            configMapKeyRef:
              name: crud-veiculos-config
              key: BASE_PATH
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /crud_veiculos/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /crud_veiculos/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: crud-veiculos-pvc
