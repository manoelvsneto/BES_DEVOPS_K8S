# Configuração do SonarCloud para análise de código

# Organização e Projeto
sonar.organization=manoelvsneto
sonar.projectKey=manoelvsneto_BES_DEVOPS_K8S
sonar.projectName=BES_DEVOPS_K8S
sonar.projectVersion=1.0

# Caminhos
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusões
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/tests/mocks/**,**/tests/fixtures/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**,**/mocks/**,**/fixtures/**,src/server.ts

# Cobertura de Testes
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Linguagem
sonar.language=ts

# Configurações de Qualidade
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Análise de Duplicação
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts

# JavaScript/TypeScript específico
sonar.javascript.node.maxspace=4096
sonar.typescript.tsconfigPath=tsconfig.json

# Métricas
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts
