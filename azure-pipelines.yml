# Azure Pipeline - CI/CD Completo
# Build, Test, SonarCloud, Docker Hub e Deploy Kubernetes
pool:
  name: BareMetal
  vmImage: 'ubuntu-22.04'

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - '*.md'

pr:
  branches:
    include:
      - main
      - develop

variables:
  # Variáveis públicas
  - name: imageName
    value: 'bes_devops_k8s'
  - name: dockerRegistry
    value: 'docker.io'
  - name: dockerUsername
    value: 'manoelvsneto'
  - name: kubernetesNamespace
    value: 'crud-veiculos'
  - name: imagePullSecret
    value: 'dockerconfigjson'
  - name: nodeVersion
    value: '20.x'
  - name: sonarCloudOrganization
    value: 'manoelvsneto'
  - name: sonarCloudProjectKey
    value: 'manoelvsneto_BES_DEVOPS_K8S'
  - name: sonarCloudProjectName
    value: 'BES_DEVOPS_K8S'

stages:
  # ========================================
  # STAGE 1: Build e Teste
  # ========================================
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
      - job: Test
        displayName: 'Run Tests and Code Analysis'
        pool:
          name: BareMetal
        
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)
          
          - script: |
              npm ci
            displayName: 'Install Dependencies'
          
          - script: |
              npm run build
            displayName: 'Build TypeScript'
          
          - script: |
              npm test -- --ci --coverage --maxWorkers=2
            displayName: 'Run Unit Tests'
          
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Unit Tests'
          
          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Code Coverage'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'
          
          # SonarCloud tasks requerem extensão do marketplace
          # Instale: https://marketplace.visualstudio.com/items?itemName=SonarSource.sonarcloud
          # - task: SonarCloudPrepare@1
          #   displayName: 'Prepare SonarCloud Analysis'
          #   inputs:
          #     SonarCloud: 'SonarCloud-Connection'
          #     organization: $(sonarCloudOrganization)
          #     scannerMode: 'CLI'
          #     configMode: 'manual'
          #     cliProjectKey: $(sonarCloudProjectKey)
          #     cliProjectName: $(sonarCloudProjectName)
          #     cliSources: 'src'
          #     extraProperties: |
          #       sonar.javascript.lcov.reportPaths=coverage/lcov.info
          #       sonar.typescript.lcov.reportPaths=coverage/lcov.info
          #       sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**
          #       sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
          #       sonar.sources=src
          #       sonar.tests=tests
          #       sonar.language=ts
          #       sonar.sourceEncoding=UTF-8
          
          # - task: SonarCloudAnalyze@1
          #   displayName: 'Run SonarCloud Analysis'
          
          # - task: SonarCloudPublish@1
          #   displayName: 'Publish SonarCloud Results'
          #   inputs:
          #     pollingTimeoutSec: '300'
          
          - script: |
              echo "##vso[task.setvariable variable=buildSuccess;isOutput=true]true"
            name: testResult
            displayName: 'Set Build Success Variable'

  # ========================================
  # STAGE 2: Build e Push Docker Image
  # ========================================
  - stage: BuildDocker
    displayName: 'Build and Push Docker Image'
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildPushDocker
        displayName: 'Build and Push to Docker Hub'
        pool:
          name: BareMetal
        
        steps:
          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              containerRegistry: 'DockerConnection'
              repository: '$(dockerUsername)/$(imageName)'
              command: 'buildAndPush'
              tags: '$(Build.BuildId)'
              Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
          
          - script: |
              echo "Docker image pushed: $(dockerUsername)/$(imageName):$(Build.BuildId)"
            displayName: 'Display Image Tags'

  # ========================================
  # STAGE 3: Deploy to Kubernetes
  # ========================================
  - stage: DeployKubernetes
    displayName: 'Deploy to Kubernetes'
    dependsOn: BuildDocker
    condition: succeeded()
    jobs:
      - deployment: DeployToK8s
        displayName: 'Deploy to Kubernetes Cluster'
        pool:
          name: BareMetal
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                # imagePullSecret criado manualmente no cluster via kubectl
                # Não criar via pipeline - gerenciado manualmente
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy to Kubernetes cluster'
                  inputs:
                    kubernetesServiceConnection: 'BAREMETAL'
                    action: deploy
                    manifests: |
                      $(Build.SourcesDirectory)/k8s/namespace.yaml
                      $(Build.SourcesDirectory)/k8s/configmap.yaml
                      $(Build.SourcesDirectory)/k8s/pvc.yaml
                      $(Build.SourcesDirectory)/k8s/deployment.yaml
                      $(Build.SourcesDirectory)/k8s/service.yaml
                      $(Build.SourcesDirectory)/k8s/ingress.yaml
                      $(Build.SourcesDirectory)/k8s/hpa.yaml
                    imagePullSecrets: |
                      $(imagePullSecret)
                    containers: '$(dockerUsername)/$(imageName):$(Build.BuildId)'
                
                
                - script: |
                    echo "Deployment completed successfully!"
                    echo "Application URL: https://alpaca-simple-newly.ngrok-free.app/apiveiculos"
                    echo "API Docs: https://alpaca-simple-newly.ngrok-free.app/apiveiculos/api-docs"
                  displayName: 'Deployment Summary'

  # ========================================
  # STAGE 4: Smoke Tests
  # ========================================
  - stage: SmokeTests
    displayName: 'Smoke Tests'
    dependsOn: DeployKubernetes
    condition: succeeded()
    jobs:
      - job: RunSmokeTests
        displayName: 'Run Smoke Tests'
        pool:
          name: BareMetal
        
        steps:
          - script: |
              echo "Waiting for application to be ready..."
              sleep 30
            displayName: 'Wait for Application Startup'
          
          - script: |
              # Health Check
              echo "Testing health endpoint..."
              response=$(curl -s -o /dev/null -w "%{http_code}" https://alpaca-simple-newly.ngrok-free.app/apiveiculos/health)
              
              if [ $response -eq 200 ]; then
                echo "✓ Health check passed"
              else
                echo "✗ Health check failed with status $response"
                exit 1
              fi
            displayName: 'Health Check'
          
          - script: |
              # API Test - List Vehicles
              echo "Testing API endpoint..."
              response=$(curl -s -o /dev/null -w "%{http_code}" https://alpaca-simple-newly.ngrok-free.app/apiveiculos/api/veiculos)
              
              if [ $response -eq 200 ]; then
                echo "✓ API endpoint accessible"
              else
                echo "✗ API endpoint failed with status $response"
                exit 1
              fi
            displayName: 'API Endpoint Test'
          
          - script: |
              # Swagger UI Test
              echo "Testing Swagger UI..."
              response=$(curl -s -o /dev/null -w "%{http_code}" https://alpaca-simple-newly.ngrok-free.app/apiveiculos/api-docs)
              
              if [ $response -eq 200 ]; then
                echo "✓ Swagger UI accessible"
              else
                echo "✗ Swagger UI failed with status $response"
                exit 1
              fi
            displayName: 'Swagger UI Test'
          
          - script: |
              echo "================================================"
              echo "🎉 All smoke tests passed!"
              echo "================================================"
              echo "Application is healthy and running"
              echo "URL: https://alpaca-simple-newly.ngrok-free.app/apiveiculos"
              echo "================================================"
            displayName: 'Smoke Tests Summary'
